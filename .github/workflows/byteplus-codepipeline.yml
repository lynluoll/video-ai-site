name: Trigger BytePlus CodePipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Forward push event to BytePlus CodePipeline
        env:
          WEBHOOK_URL: ${{ secrets.BYTEPLUS_CODEPIPELINE_WEBHOOK_URL }}
        run: |
          test -n "$WEBHOOK_URL"
          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "$WEBHOOK_URL"
